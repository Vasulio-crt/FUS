<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#1e1b4b">
	<title>Загрузка файлов</title>
	<link rel="shortcut icon" href="favicon.svg">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<h1>📁 Загрузка файлов</h1>

		<div class="upload-zone" id="uploadZone">
			<div class="upload-icon">☁️</div>
			<p>Нажмите или перетащите файлы</p>
			<span class="hint">Максимум: 100 MB</span>
			<input type="file" id="fileInput" multiple>
		</div>

		<div class="selected-files" id="selectedFiles">
			<h3>📋 Выбранные файлы:</h3>
			<div id="selectedList"></div>
		</div>

		<button class="upload-btn" id="uploadBtn" onclick="uploadFiles()">
			⬆️ Загрузить
		</button>

		<div class="progress-container" id="progressContainer">
			<div class="progress-bar">
				<div class="progress-fill" id="progressFill"></div>
			</div>
			<div class="progress-text" id="progressText">Загрузка...</div>
		</div>

		<div class="files-section">
			<div class="files-header">
				<h2>📂 Файлы <span class="count" id="fileCount">0</span></h2>
				<div class="header-actions">
					<div class="cache-info" id="cacheInfo"></div>
					<button class="btn-refresh" id="refreshBtn" onclick="forceRefresh()" aria-label="Обновить">🔄</button>
				</div>
			</div>
			<div class="files-list" id="filesList">
				<div class="empty-state">
					<div class="empty-icon">📭</div>
					<div>Загрузка...</div>
				</div>
			</div>
		</div>
	</div>

	<div class="modal-overlay" id="passwordModal" onclick="handleOverlayClick(event)">
		<div class="modal" onclick="event.stopPropagation()">
			<div class="modal-handle"></div>
			<h3>🔐 Требуется пароль</h3>
			<p>Для удаления файла «<span id="deleteFileName"></span>» введите пароль.</p>
			<input 
				type="password" 
				id="deletePassword" 
				placeholder="Введите пароль" 
				autocomplete="off"
				inputmode="text"
			>
			<div class="modal-error" id="modalError">Неверный пароль</div>
			<div class="remember-password">
				<input type="checkbox" id="rememberPassword">
				<label for="rememberPassword">Запомнить на 1 час</label>
			</div>
			<div class="modal-buttons">
				<button class="btn-cancel" onclick="closePasswordModal()">Отмена</button>
				<button class="btn-confirm" id="confirmDeleteBtn" onclick="confirmDelete()">Удалить</button>
			</div>
		</div>
	</div>

	<script src="script.js"></script>
</body>
</html>
