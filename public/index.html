<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Загрузка файлов</title>
	<link rel="shortcut icon" href="favicon.svg">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<h1>📁 Загрузка файлов на Google Drive</h1>

		<div class="upload-zone" id="uploadZone">
			<div class="upload-icon">☁️</div>
			<p>Перетащите файлы сюда или нажмите для выбора</p>
			<span class="hint">Максимальный размер: 100 MB</span>
			<input type="file" id="fileInput" multiple>
		</div>

		<div class="selected-files" id="selectedFiles">
			<h3>📋 Выбранные файлы:</h3>
			<div id="selectedList"></div>
		</div>

		<button class="upload-btn" id="uploadBtn" onclick="uploadFiles()">⬆️ Загрузить файлы</button>

		<div class="progress-container" id="progressContainer">
			<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
			<div class="progress-text" id="progressText">Загрузка...</div>
		</div>

		<div class="files-section">
			<div class="files-header">
				<h2>📂 Загруженные файлы <span class="count" id="fileCount">0</span></h2>
				<div style="display: flex; align-items: center; gap: 12px;">
					<div class="cache-info" id="cacheInfo"></div>
					<button class="btn-refresh" id="refreshBtn" onclick="forceRefresh()">🔄</button>
				</div>
			</div>
			<div class="files-list" id="filesList">
				<div class="empty-state">Загрузка...</div>
			</div>
		</div>
	</div>

	<div class="modal-overlay" id="passwordModal">
		<div class="modal">
			<h3>🔐 Требуется пароль</h3>
			<p>Для удаления файла "<span id="deleteFileName"></span>" введите пароль администратора.</p>
			<input type="password" id="deletePassword" placeholder="Введите пароль" autocomplete="off">
			<div class="modal-error" id="modalError">Неверный пароль</div>
			<div class="remember-password">
				<input type="checkbox" id="rememberPassword">
				<label for="rememberPassword">Запомнить пароль на 1 час</label>
			</div>
			<div class="modal-buttons">
				<button class="btn-cancel" onclick="closePasswordModal()">Отмена</button>
				<button class="btn-confirm" id="confirmDeleteBtn" onclick="confirmDelete()">Удалить</button>
			</div>
		</div>
	</div>

	<script src="script.js"></script>
</body>
</html>
